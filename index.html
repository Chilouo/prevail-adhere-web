<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHILO.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Klee+One&display=swap" rel="stylesheet">

</head>
<body>
  
<div class="sky" id="sky0"></div><div class="sky" id="sky1"></div><canvas id="stars"></canvas>
<div id="toast" role="status"></div>
<main>
  <div class="logo">CHILO.</div>
  <section class="hero">
    <h1>Make a dent in the universe.</h1>
    <p class="sub">飞光，飞光，僻远其何伤。</p >
    <button id="hello">Chilo~(∠・ω[ )⌒☆</button>
    <div id="cards"></div>
  </section>
  <div class="skyname" id="skyname"></div>
</main>
 <section id="fall">
  <p class="fl"><span>月球的背面或是书里也没有记载过的地方，</span></p >
  <p class="fl"><span>要从空中</span></p >
  <div class="drop">
    <i style="--x:42%;--y:0%">坠</i>
    <i style="--x:29%;--y:24%">落</i>
    <i style="--x:44%;--y:40%">下</i>
    <i style="--x:55%;--y:57%">了</i>
    <i style="--x:28%;--y:75%">哦</i>
    <i style="--x:22%;--y:96%">。</i>
  </div>
</section>

<section id="moon-section">
  <div id="moon-stage" style="position:relative">
  <img id="moon1" src="images/moon1.png" alt="">
  <svg id="moon-ring" viewBox="0 0 300 400" aria-hidden="true"
     style="position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none">
  <g fill="#fff4dc" font-size="16" text-anchor="middle" font-family="Klee One, Yu Gothic, Hiragino Sans, sans-serif">
    <g transform="rotate(4 98 22)"><text x="98" y="22" style="--d:0">そ</text></g>
    <g transform="rotate(5 128 25)"><text x="128" y="25" style="--d:1">れ</text></g>
    <g transform="rotate(6 162 29)"><text x="162" y="29" style="--d:2">く</text></g>
    <g transform="rotate(7 200 34)"><text x="200" y="34" style="--d:3">ら</text></g>
    <g transform="rotate(8 242 40)"><text x="242" y="40" style="--d:4">い</text></g>
    <g transform="rotate(9 284 47)"><text x="284" y="47" style="--d:5">、</text></g>

    <g transform="rotate(-18 238 120)"><text x="238" y="120" style="--d:6">月</text></g>
    <g transform="rotate(-16 253 147)"><text x="253" y="147" style="--d:7">を</text></g>
    <g transform="rotate(-12 265 174)"><text x="265" y="174" style="--d:8">歩</text></g>
    <g transform="rotate(-4 271 201)"><text x="271" y="201" style="--d:9">い</text></g>
    <g transform="rotate(4 271 229)"><text x="271" y="229" style="--d:10">て</text></g>
    <g transform="rotate(12 265 256)"><text x="265" y="256" style="--d:11">い</text></g>
    <g transform="rotate(16 253 283)"><text x="253" y="283" style="--d:12">る</text></g>
    <g transform="rotate(18 238 310)"><text x="238" y="310" style="--d:13">。</text></g>
  </g>
</svg>

</div>

</section>
<div id="viewer" role="dialog" aria-modal="true">
  <div class="vbar">
    <span id="vtitle"></span><span id="vcount"></span>
    <span> <button class="vbtn" id="vdel">删除</button> <button class="vbtn" id="vclose">关闭</button></span>
  </div>
  <div class="stage"><button class="vbtn nav" id="vprev" aria-label="上一张">‹</button><div id="vbody" style="display:contents"></div><button class="vbtn nav" id="vnext" aria-label="下一张">›</button></div>
  <input type="file" id="file" accept="image/*" multiple hidden>
</div>
<section id="film-section">
  <div id="film"><div id="film-track"></div></div>
</section>

<div id="moon-zoom">
  <img src="images/moon2.png" alt="">
  <div id="moon-text">目前没想到写什么。wait </div>
</div>
<script src="script.js"></script>
</body>
</html>
